image: eclipse-temurin:21-jdk

stages:
  - build
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key:
    files:
      - build.gradle
      - settings.gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - build/

before_script:
  - chmod +x ./gradlew

build:
  stage: build
  script:
    - ./gradlew --build-cache assemble -x test
  artifacts:
    paths:
      - build/classes/
      - build/resources/
      - build/libs/
    expire_in: 1 week

test:
  stage: test
  services:
    - name: postgres:18.1-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hotels_test
    POSTGRES_USER: spring
    POSTGRES_PASSWORD: spring
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotels_test
    SPRING_DATASOURCE_USERNAME: spring
    SPRING_DATASOURCE_PASSWORD: spring
    SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    SPRING_SQL_INIT_MODE: never
  script:
    - bash -c 'for i in {1..30}; do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
    - ./gradlew --build-cache test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
      - build/test-results/test/
    expire_in: 1 week
