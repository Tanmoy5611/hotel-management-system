# Separate PostgreSQL database for tests so test data never affects development or production data
spring.datasource.url=jdbc:postgresql://localhost:5051/hotels_test
spring.datasource.username=spring
spring.datasource.password=spring
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tests should not start a real Python process or bind port 8001
hotel.ai.service.auto-start=false