<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{rooms.title}">Rooms</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- include the navigation bar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<h2 th:text="#{rooms.title}">All Rooms</h2>

<!-- filter form for rooms-->
<form th:action="@{/rooms}" method="get" style="margin:10px 0">
    <label for="type" th:text="#{rooms.filter.type}">Type (optional):</label>
    <select id="type" name="type">
        <option value="">-- Select Type --</option>
        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                th:selected="${t.toString() == selType}"></option>
    </select>

    <label for="sea" th:text="#{rooms.filter.sea}">Sea view (optional):</label>
    <input id="sea" type="checkbox" name="sea" th:checked="${selSea}">

    <label for="maxPrice" th:text="#{rooms.filter.max}">Max price (optional):</label>
    <input id="maxPrice" type="number" step="0.01" name="maxPrice" th:value="${selPrice}">

    <button type="submit" th:text="#{button.filter}">Filter</button>
</form>

<!-- show table of all rooms -->
<table class="data-table">
    <thead>
    <tr>
        <th th:text="#{rooms.table.number}">Number</th>
        <th th:text="#{rooms.table.type}">Type</th>
        <th th:text="#{rooms.table.price}">Price / night (€)</th>
        <th th:text="#{rooms.table.seaView}">Sea View</th>
        <th th:text="#{rooms.table.photo}">Photo URL</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rooms}" th:classappend="${r.pricePerNight} >= 300 ? 'expensive' : ''">
        <td th:text="${r.number}"></td>
        <td th:text="${r.type}"></td>
        <td th:text="${r.pricePerNight}"></td>
        <td th:text="${r.seaView}"></td>
        <td>
            <img th:src="@{${r.photoUrl}}" alt="Room photo" class="room-image">
        </td>
    </tr>
    </tbody>
</table>

<p>
    <span th:text="#{rooms.total}">Total rooms:</span>
    <span th:text="${#lists.size(rooms)}"></span>
</p>

</body>
</html>
