<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{rooms.title}">Rooms</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-4">
    <h2 class="text-primary mb-3" th:text="#{rooms.title}">All Rooms</h2>

    <form th:action="@{/rooms}" method="get"
          class="row g-3 mb-4 align-items-end">

        <div class="col-md-3">
            <label class="form-label fw-semibold"
                   th:text="#{rooms.filter.number}">
                Room number
            </label>
            <input type="number"
                   name="number"
                   min="0"
                   class="form-control"
                   th:value="${param.number}"
                   th:placeholder="#{rooms.filter.number.placeholder}">
        </div>

        <div class="col-md-3">
            <label for="type"
                   class="form-label fw-semibold"
                   th:text="#{rooms.filter.type}">
                Type
            </label>
            <select id="type" name="type" class="form-select">
                <option value="" th:text="#{rooms.selectType}"></option>
                <option th:each="t : ${types}"
                        th:value="${t}"
                        th:text="${t}"
                        th:selected="${t.toString() == selType}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label fw-semibold d-block"
                   th:text="#{rooms.filter.sea}">
                Sea View
            </label>
            <div class="form-check mt-2">
                <input id="sea"
                       type="checkbox"
                       name="sea"
                       value="true"
                       th:checked="${selSea}"
                       class="form-check-input">
                <label for="sea" class="form-check-label">✓</label>
            </div>
        </div>

        <div class="col-md-2">
            <label for="maxPrice"
                   class="form-label fw-semibold"
                   th:text="#{rooms.filter.max}">
                Max price
            </label>
            <input id="maxPrice"
                   type="number"
                   min="0"
                   step="0.01"
                   name="maxPrice"
                   th:value="${selPrice}"
                   class="form-control">
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-search"></i>
                <span th:text="#{button.filter}">Filter</span>
            </button>
        </div>

    </form>

    <!-- Room Cards -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

        <!--  Added id for DOM removal -->
        <div class="col"
             th:each="r : ${rooms}"
             th:id="'room-' + ${r.id}">

            <div class="card h-100 shadow-sm hover-card">

                <a th:href="@{/rooms/{id}(id=${r.id})}" class="text-decoration-none text-dark">

                    <img th:src="${r.photoUrl}"
                         class="card-img-top room-img"
                         th:alt="#{rooms.photoAlt}">

                    <div class="card-body">

                        <h5 class="card-title text-center fw-bold mb-3"
                            th:text="#{room.numberLabel(${r.number})}">
                        </h5>

                        <p class="card-text mb-2">
                            <i class="bi bi-door-open"></i>
                            <span th:text="${r.type}"></span>
                        </p>

                        <p class="card-text mb-2">
                            <i class="bi bi-cash-coin text-success"></i>
                            <span th:text="${#numbers.formatDecimal(r.pricePerNight,1,2)} + ' € ' + #{rooms.perNight}"></span>
                        </p>

                        <p class="card-text d-flex align-items-center gap-2">
                            <i class="bi"
                               th:classappend="${r.seaView}
                               ? 'bi-water text-info'
                               : 'bi-x-circle text-muted'">
                            </i>
                            <span th:text="${r.seaView} ? #{rooms.seaYes} : #{rooms.seaNo}"></span>
                        </p>

                        <p class="text-muted small">
                            <i class="bi bi-building"></i>
                            <span th:text="${r.hotel != null ? r.hotel.name : #messages.msg('rooms.unknownHotel')}"></span>
                        </p>

                    </div>
                </a>

                <!-- FOOTER -->
                <div class="card-footer small d-flex justify-content-between align-items-center">
                    <span class="text-muted"
                          th:text="#{rooms.footer.text}">
                    </span>

                    <!-- Admin only delete button -->
                    <div sec:authorize="hasRole('ADMIN')">

                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                th:data-bs-target="${'#deleteRoomModal-' + r.id}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Delete modalL -->
            <div sec:authorize="hasRole('ADMIN')" class="modal fade"
                 th:id="${'deleteRoomModal-' + r.id}"
                 tabindex="-1">

                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">

                        <div class="modal-header bg-danger text-white py-2">
                            <h6 class="modal-title"
                                th:text="#{modal.delete.title}">
                            </h6>
                            <button type="button"
                                    class="btn-close btn-close-white"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body text-center">
                            <p th:text="#{modal.delete.question}"></p>
                            <strong th:text="#{room.numberLabel(${r.number})}"></strong>
                        </div>

                        <div class="modal-footer justify-content-between">

                            <button type="button"
                                    class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="modal"
                                    th:text="#{button.cancel}">
                            </button>

                            <!-- Removed form, added AJAX button -->
                            <button type="button"
                                    class="btn btn-danger btn-sm delete-room-btn"
                                    th:attr="data-room-id=${r.id}"
                                    data-bs-dismiss="modal"
                                    th:text="#{button.delete}">
                            </button>

                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>

    <p class="mt-4 text-muted">
        <i class="bi bi-collection"></i>
        <span th:text="${#lists.size(rooms)} + ' ' + #{rooms.total}"></span>
    </p>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

<!-- AJAX script -->
<script defer th:src="@{/js/bundle-rooms.js}"></script>

</body>
</html>
