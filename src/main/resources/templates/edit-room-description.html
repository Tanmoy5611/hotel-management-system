<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/bundle-edit-description.css}">
    <title>Edit Room Description</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-5">

    <!-- Not allowed message -->
    <div sec:authorize="!hasRole('ADMIN')" class="alert alert-danger">
        You are not allowed to edit room descriptions.
    </div>

    <!-- Admin only -->
    <div sec:authorize="hasRole('ADMIN')">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    Edit Room Description
                </h5>
            </div>

            <div class="card-body">

                <form th:action="@{/rooms/{id}/edit-description(id=${room.id})}"
                      method="post">

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-info-circle me-1"></i>
                            Room Description
                        </label>

                        <textarea id="description"
                                  name="description"
                                  class="form-control"
                                  rows="8"
                                  maxlength="1000"
                                  placeholder="Describe the room, comfort, view, and special features..."
                                  th:text="${room.description}">
                    </textarea>

                        <!-- Counter -->
                        <div class="d-flex justify-content-between mt-1">
                            <small class="text-muted">
                                Max 1000 characters
                            </small>
                            <small id="charCounter" class="char-counter">
                                0 / 1000
                            </small>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>
                            Save
                        </button>

                        <a th:href="@{/rooms/{id}(id=${room.id})}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

<!-- Reusable JS -->
<script defer th:src="@{/js/bundle-edit-description.js}"></script>

</body>
</html>
