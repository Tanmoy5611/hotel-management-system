<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title>Add User</title>
</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-4">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h3 class="mb-4 text-center">

                        <i class="bi bi-person-plus"></i>
                        Add New User

                    </h3>

                    <!-- Error message for existing applicationUser email -->
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/admin/users/add}"
                          th:object="${registerForm}"
                          method="post">

                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">Email</label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                        </div>


                        <!-- Password -->
                        <div class="mb-4">

                            <label class="form-label">Password</label>

                            <div class="input-group">

                                <input type="password"
                                       id="registerPasswordField"
                                       th:field="*{password}"
                                       class="form-control"
                                       placeholder="Enter password"
                                       required>

                                <span class="input-group-text"
                                      onclick="togglePassword()"
                                      style="cursor:pointer">
                                    <i id="registerEyeIcon" class="bi bi-eye"></i>
                                </span>

                            </div>

                        </div>

                        <div class="d-grid gap-2">

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-check-circle"></i>
                                Create User

                            </button>

                            <a th:href="@{/admin/users/manage}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer-->
<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/bundle-auth.js}"></script>

</body>
</html>
