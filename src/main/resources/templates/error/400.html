<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
>

<head>
    <meta charset="UTF-8">
    <title>400 - Bad Request</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container text-center mt-5">

    <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>

    <h1 class="mt-3 text-danger">400</h1>
    <h3>Bad Request</h3>

    <p class="text-muted" th:text="${message}">
        Something is wrong with your request.
    </p>

    <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> Back Home
    </a>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
