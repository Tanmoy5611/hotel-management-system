<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{error.badRequest.title}">400 - Bad Request</title>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container text-center mt-5">

    <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>

    <h1 class="mt-3 text-danger">400</h1>
    <h3 th:text="#{error.badRequest.heading}">Bad Request</h3>

    <p class="text-muted" th:text="${#ctx.getVariable('message')} ?: #{error.badRequest.message}">
        Something is wrong with your request.
    </p>

    <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> <span th:text="#{error.backHome}">Back Home</span>
    </a>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
