<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="#{error.database.title}">Database problem</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container py-5">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <h2 class="mb-2">
        <i class="bi bi-database-exclamation"></i>
        <span th:text="#{error.database.heading}">
                    Database problem
        </span>
      </h2>

      <p class="text-muted mb-4"
         th:text="#{error.database.message}">
        Something went wrong while reading or saving data. Please try again later.
      </p>

      <!-- Optional details (only shown if controller sends them) -->
      <div th:if="${errorMessage != null}" class="alert alert-warning">
        <strong th:text="#{error.details}">Details:</strong>
        <span th:text="${errorMessage}"></span>
      </div>

      <a class="btn btn-primary" th:href="@{/home}">
        <i class="bi bi-house-door"></i>
        <span th:text="#{error.backHome}">Back to Home</span>
      </a>

    </div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
