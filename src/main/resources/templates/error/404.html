<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{error.notFound.title}">404 - Not Found</title>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container text-center mt-5">

    <i class="bi bi-search text-primary display-1"></i>

    <h1 class="mt-3 text-primary">404</h1>
    <h3 th:text="#{error.notFound.heading}">Page Not Found</h3>

    <p class="text-muted" th:text="${#ctx.getVariable('message')} ?: #{error.notFound.message}">
        The page you are looking for does not exist.
    </p>

    <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> <span th:text="#{error.backHome}">Back Home</span>
    </a>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
