<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{error.server.title}">500 - Server Error</title>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container text-center mt-5">

    <i class="bi bi-bug-fill text-dark display-1"></i>

    <h1 class="mt-3 text-dark">500</h1>
    <h3 th:text="#{error.server.heading}">Something went wrong</h3>

    <p class="text-muted" th:text="${#ctx.getVariable('message')} ?: #{error.server.message}">
        Unexpected server error.
    </p>

    <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> <span th:text="#{error.backHome}">Back Home</span>
    </a>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
