<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Forbidden</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container text-center mt-5">

    <i class="bi bi-shield-lock-fill text-danger display-1"></i>

    <h1 class="mt-3 text-danger">403</h1>
    <h3>Access Denied</h3>

    <p class="text-muted" th:text="${message}">
        You are not allowed to perform this action.
    </p>

    <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> Back Home
    </a>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
