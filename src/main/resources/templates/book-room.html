<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{booking.title}">Book a Room</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h4 class="mb-0" th:text="#{booking.header}">Create New Booking</h4>
                </div>

                <div class="card-body">

                    <!-- Booking Info -->
                    <p>
                        <span th:text="#{booking.youAreBooking}"></span>
                        <strong>
                            <span th:text="#{booking.room}"></span>
                            <span th:text="${room.number}"></span>
                        </strong>
                        <span th:text="#{booking.at}"></span>
                        <span th:text="${room.hotel.name}"></span>.
                    </p>

                    <!--  ERROR BLOCK -->
                    <div th:if="${errorCode}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert">

                        <strong th:text="#{${errorCode}}"></strong>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>
                    </div>

                    <form th:action="@{/rooms/{id}/book(id=${room.id})}" method="post">

                        <!-- Guest Selection -->
                        <div class="mb-3">
                            <label class="form-label"
                                   th:text="#{booking.selectGuest}"></label>

                            <select name="guestId"
                                    class="form-select"
                                    required>

                                <option value=""
                                        disabled
                                        selected
                                        th:text="#{booking.searchGuest}">
                                </option>

                                <option th:each="g : ${allGuests}"
                                        th:value="${g.id}"
                                        th:selected="${g.id == selectedGuestId}"
                                        th:text="${g.fullName} + ' (' + ${g.email} + ')'">
                                </option>
                            </select>
                        </div>

                        <!-- Check-in -->
                        <div class="mb-3">
                            <label class="form-label"
                                   th:text="#{booking.checkIn}"></label>

                            <input type="date"
                                   name="checkIn"
                                   class="form-control"
                                   th:value="${selectedCheckIn}"
                                   required>
                        </div>

                        <!-- Check-out -->
                        <div class="mb-4">
                            <label class="form-label"
                                   th:text="#{booking.checkOut}"></label>

                            <input type="date"
                                   name="checkOut"
                                   class="form-control"
                                   th:value="${selectedCheckOut}"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/rooms/{id}(id=${room.id})}"
                               class="btn btn-light"
                               th:text="#{booking.back}">
                            </a>

                            <button type="submit"
                                    class="btn btn-success"
                                    th:text="#{booking.confirm}">
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
