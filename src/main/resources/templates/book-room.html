<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{booking.title}">Book a Room</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: body}"></div>

<div sec:authorize="hasAnyRole('USER','ADMIN')" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h4 class="mb-0" th:text="#{booking.header}">Create New Booking</h4>
                </div>

                <div class="card-body">

                    <!-- Room Summary -->
                    <div class="alert alert-light border mb-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <strong>
                                    <i class="bi bi-door-open me-1"></i>
                                    <span th:text="'Room ' + ${room.number}"></span>
                                </strong>
                                <br>
                                <small class="text-muted"
                                       th:text="${room.hotel.name}">
                                </small>
                            </div>

                            <div class="text-end">
                <span class="fw-bold text-success"
                      th:text="${#numbers.formatDecimal(room.pricePerNight,1,2)} + ' € / night'">
                </span>
                            </div>

                        </div>

                    </div>

                    <!-- Error block for room availability -->
                    <div th:if="${errorCode}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert">

                        <strong th:text="#{${errorCode}}"></strong>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>


                    <!-- Booking Form -->
                    <form th:action="@{/rooms/{id}/book(id=${room.id})}" method="post">

                        <!-- Guest Selection -->
                        <div class="mb-3">
                            <label class="form-label"
                                   th:text="#{booking.selectGuest}">
                            </label>

                            <select name="guestId"
                                    class="form-select"
                                    required>

                                <option value=""
                                        disabled
                                        th:selected="${selectedGuestId == null}"
                                        th:text="#{booking.searchGuest}">
                                </option>

                                <option th:each="g : ${allGuests}"
                                        th:value="${g.id}"
                                        th:selected="${g.id == selectedGuestId}"
                                        th:text="${g.fullName} + ' (' + ${g.email} + ')'">
                                </option>

                            </select>
                        </div>

                        <!-- Check-in -->
                        <div class="mb-3">
                            <label class="form-label"
                                   th:text="#{booking.checkin}">
                            </label>

                            <input type="date"
                                   name="checkIn"
                                   class="form-control"
                                   th:value="${selectedCheckIn}"
                                   required>
                        </div>

                        <!-- Check-out -->
                        <div class="mb-4">
                            <label class="form-label"
                                   th:text="#{booking.checkout}">
                            </label>

                            <input type="date"
                                   name="checkOut"
                                   class="form-control"
                                   th:value="${selectedCheckOut}"
                                   required>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">

                            <a th:href="@{/rooms/{id}(id=${room.id})}"
                               class="btn btn-light"
                               th:text="#{booking.back}">
                            </a>

                            <button type="submit"
                                    class="btn btn-success"
                                    th:text="#{booking.confirm}">
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>


<!-- Anonymous users -->
<div sec:authorize="isAnonymous()" class="container mt-5 text-center">

    <div class="alert alert-warning shadow-sm">

        <i class="bi bi-lock-fill me-2"></i>
        You must be logged in to book a room.

    </div>

    <a href="/login" class="btn btn-primary btn-lg">
        <i class="bi bi-box-arrow-in-right me-1"></i>
        Login
    </a>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
