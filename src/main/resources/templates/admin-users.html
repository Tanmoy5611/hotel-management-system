<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <title th:text="#{users.title}">User Management</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-4">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-semibold">
            <i class="bi bi-people"></i>
            <span th:text="#{users.management}">User Management</span>
        </h2>

        <div>

            <a th:href="@{/home}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-house"></i>
                <span th:text="#{users.home}">Home</span>
            </a>

            <a th:href="@{/admin/users/add}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i>
                <span th:text="#{users.add}">Add User</span>
            </a>

        </div>

    </div>

    <!-- Search -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <input type="text"
                   id="userSearch"
                   class="form-control"
                   th:placeholder="#{users.search}"
                   placeholder="Search users by email...">
        </div>
    </div>

    <!-- Users table -->
    <div class="card shadow-sm border-0">

        <div class="card-body">

            <table class="table table-hover align-middle" id="usersTable">

                <thead class="table-light">
                <tr>
                    <th th:text="#{users.email}">Email</th>
                    <th th:text="#{users.role}">Role</th>
                    <th style="width:260px" th:text="#{users.actions}">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="user : ${users}">

                    <td>
                        <i class="bi bi-person-circle me-2"></i>
                        <span th:text="${user.email}"></span>
                    </td>

                    <td>

                        <span class="badge"
                              th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'">

                            <i class="bi"
                               th:classappend="${user.role == 'ADMIN'} ? 'bi-shield-lock' : 'bi-person'">
                            </i>

                            <span th:text="${user.role}"></span>

                        </span>

                    </td>

                    <td class="d-flex gap-2">

                        <button type="button"
                                class="btn btn-warning btn-sm"
                                th:if="${user.email != 'admin@hotelapp.com'}"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#roleModal__' + ${user.id}">

                            <i class="bi bi-arrow-repeat"></i>
                            <span th:text="#{users.changeRole}">Change Role</span>

                        </button>

                        <button type="button"
                                class="btn btn-danger btn-sm"
                                th:if="${user.email != 'admin@hotelapp.com'}"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#deleteModal__' + ${user.id}">

                            <i class="bi bi-trash"></i>
                            <span th:text="#{users.delete}">Delete</span>

                        </button>

                        <span class="text-muted small"
                              th:if="${user.email == 'admin@hotelapp.com'}"
                              th:text="#{users.protected}">
                            protected
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Change Role modals -->
<div th:each="user : ${users}">

    <div class="modal fade"
         th:id="'roleModal__' + ${user.id}"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="#{users.changeRole}">
                        Change User Role
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <span th:text="#{users.changeRoleConfirm}">
                        Change role of
                    </span>

                    <strong th:text="${user.email}"></strong> ?

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{users.cancel}">
                        Cancel
                    </button>

                    <form th:action="@{/admin/users/{id}/toggle-role(id=${user.id})}"
                          method="post">

                        <button class="btn btn-warning"
                                th:text="#{users.confirmRole}">
                            Yes, Change Role
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Delete modal -->
<div th:each="user : ${users}">

    <div class="modal fade"
         th:id="'deleteModal__' + ${user.id}"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="#{users.deleteUser}">
                        Delete User
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <span th:text="#{users.deleteConfirm}">
                        Delete user
                    </span>

                    <strong th:text="${user.email}"></strong> ?

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{users.cancel}">
                        Cancel
                    </button>

                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                          method="post">

                        <button class="btn btn-danger"
                                th:text="#{users.confirmDelete}">
                            Yes, Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/user-search.js}"></script>

</body>
</html>
