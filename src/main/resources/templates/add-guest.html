<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{guest.add.title}">Add Guest</title>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<!-- Main -->
<main class="flex-grow-1">
    <div sec:authorize="hasAnyRole('USER','ADMIN')" class="container my-4">

        <!-- Page title -->
        <h2 class="text-primary mb-4">
            <i class="bi bi-person-plus-fill"></i>
            <span th:text="#{guest.add.title}">Add Guest</span>
        </h2>

        <!-- Wide centered form -->
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <form th:action="@{/guests/add}"
                      th:object="${guestForm}"
                      method="post"
                      class="card p-4 shadow-sm needs-validation"
                      novalidate>

                    <div class="row g-3">

                        <!-- Full Name -->
                        <div class="col-12">
                            <label for="fullName" class="form-label fw-semibold"
                                   th:text="#{guest.form.fullName}">
                                Full Name
                            </label>
                            <input id="fullName"
                                   type="text"
                                   th:field="*{fullName}"
                                   class="form-control"
                                   th:placeholder="#{guest.placeholder.name}">
                            <div class="text-danger small mt-1"
                                 th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="col-12">
                            <label for="email" class="form-label fw-semibold"
                                   th:text="#{guest.form.email}">
                                Email
                            </label>
                            <input id="email"
                                   type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:placeholder="#{guest.placeholder.email}">
                            <div class="text-danger small mt-1"
                                 th:errors="*{email}"></div>
                        </div>

                        <!-- Date of Birth -->
                        <div class="col-12">
                            <label for="dob" class="form-label fw-semibold"
                                   th:text="#{guest.form.dob}">
                                Date of Birth
                            </label>
                            <input id="dob"
                                   type="date"
                                   th:field="*{dob}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{dob}"></div>
                        </div>

                        <!-- Avatar URL -->
                        <div class="col-12">
                            <label for="avatarUrl" class="form-label fw-semibold"
                                   th:text="#{guest.form.avatar}">
                                Avatar URL
                            </label>
                            <input id="avatarUrl"
                                   type="text"
                                   th:field="*{avatarUrl}"
                                   class="form-control"
                                   th:placeholder="#{guest.placeholder.avatar}">
                        </div>

                        <!-- Discount (VIP if > 0) -->
                        <div class="col-12">
                            <label for="discountPercentage" class="form-label fw-semibold"
                                   th:text="#{guest.form.discount}">
                                Discount (%)
                            </label>
                            <input id="discountPercentage"
                                   type="number"
                                   min="0"
                                   max="100"
                                   th:field="*{discountPercentage}"
                                   class="form-control"
                                   th:placeholder="#{guest.placeholder.discount}">
                            <div class="text-danger small mt-1"
                                 th:errors="*{discountPercentage}"></div>
                            <div class="form-text">
                                <span th:text="#{guest.form.discountHint}">
                                    Leave 0 for regular guest
                                </span>
                            </div>
                        </div>

                        <!-- Assign Room (optional) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{guest.form.room}">
                                Assign Room (optional)
                            </label>

                            <select id="roomSelect" th:field="*{roomId}" class="form-select">
                                <option value="" th:text="#{guest.placeholder.room}">
                                    -- Select Room --
                                </option>

                                <option th:each="r : ${rooms}"
                                        th:value="${r.id}"
                                        th:text="'Room ' + ${r.number} + ' (' + ${r.hotel.name} + ')'">
                                </option>
                            </select>
                        </div>

                        <!-- Check-in -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold"
                                   th:text="#{booking.checkin}">
                                Check-in
                            </label>
                            <input type="date"
                                   id="checkIn"
                                   th:field="*{checkIn}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{checkIn}"></div>
                        </div>

                        <!-- Check-out -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold"
                                   th:text="#{booking.checkout}">
                                Check-out
                            </label>
                            <input type="date"
                                   id="checkOut"
                                   th:field="*{checkOut}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{checkOut}"></div>
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle"></i>
                            <span th:text="#{button.save}">Save</span>
                        </button>

                        <a th:href="@{/guests}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i>
                            <span th:text="#{guest.back}">Back</span>
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/guest-form.js}"></script>

</body>
</html>
