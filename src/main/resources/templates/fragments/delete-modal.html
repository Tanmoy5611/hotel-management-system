<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="formDeleteModal(modalId, questionMessage, itemName, actionUrl)"
     class="modal fade"
     th:id="${modalId}"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">

            <div class="modal-header bg-danger text-white py-2">
                <h6 class="modal-title" th:text="#{modal.delete.title}">
                    Confirm Delete
                </h6>
                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body text-center">
                <p class="mb-2" th:text="${questionMessage}">
                    Delete this item?
                </p>
                <strong th:text="${itemName}"></strong>
            </div>

            <div class="modal-footer justify-content-between">
                <button type="button"
                        class="btn btn-secondary btn-sm"
                        data-bs-dismiss="modal"
                        th:text="#{button.cancel}">
                    Cancel
                </button>

                <form th:action="${actionUrl}" method="post">
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            th:text="#{button.delete}">
                        Delete
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

</html>
