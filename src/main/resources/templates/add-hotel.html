<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/bundle-add-hotel.css}">
    <title th:text="#{nav.addHotel}">Add Hotel</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<!-- MAIN -->
<main class="flex-grow-1">
    <div class="container my-4">

        <!-- Page title -->
        <h2 class="text-primary mb-4">
            <i class="bi bi-building-add"></i>
            <span th:text="#{nav.addHotel}">Add Hotel</span>
        </h2>

        <div id="formError"
             class="alert alert-danger alert-dismissible fade show d-none"
             role="alert">
            <span id="formErrorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div id="createdHotel" class="alert alert-success d-none" role="status">
            <span id="createdHotelMessage"></span>
            <a id="createdHotelLink" class="alert-link ms-2">View hotel</a>
        </div>

        <!-- Wide centered form -->
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <!-- Not allowed message -->
                <div sec:authorize="!hasRole('ADMIN')" class="alert alert-danger">
                    <span th:text="#{auth.notAllowed.page}">You are not allowed to access this page.</span>
                </div>

                <!-- Admin only form -->
                <div sec:authorize="hasRole('ADMIN')">

                    <form id="add-hotel-form"
                          th:action="@{/hotels/add}"
                          th:object="${hotelForm}"
                          method="post"
                          class="card p-4 shadow-sm needs-validation"
                          novalidate>

                        <div class="row g-3">

                            <!-- Hotel name -->
                            <div class="col-12">
                                <label class="form-label fw-semibold"
                                       th:text="#{hotels.table.name}">
                                    Name
                                </label>
                                <input type="text"
                                       th:field="*{name}"
                                       required
                                       class="form-control">
                                <div class="text-danger small mt-1"
                                     th:errors="*{name}"></div>
                            </div>

                            <!-- City -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" th:text="#{hotels.table.city}"></label>
                                <input type="text" th:field="*{city}" required class="form-control">
                                <div class="text-danger small" th:errors="*{city}"></div>
                            </div>

                            <!-- Country -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" th:text="#{hotels.table.country}"></label>
                                <input type="text" th:field="*{country}" required class="form-control">
                                <div class="text-danger small" th:errors="*{country}"></div>
                            </div>

                            <!-- Opened on -->
                            <div class="col-12">
                                <label class="form-label fw-semibold"
                                       th:text="#{hotels.table.opened}">
                                    Opened On
                                </label>
                                <input type="date"
                                       th:field="*{openedOn}"
                                       required
                                       class="form-control">
                                <div class="text-danger small mt-1"
                                     th:errors="*{openedOn}"></div>
                            </div>

                            <!-- Stars -->
                            <div class="col-12">
                                <label class="form-label fw-semibold"
                                       th:text="#{hotels.table.stars}">
                                    Stars
                                </label>
                                <input type="number"
                                       min="1"
                                       max="5"
                                       required
                                       th:field="*{stars}"
                                       class="form-control">
                                <div class="text-danger small mt-1"
                                     th:errors="*{stars}"></div>
                            </div>

                            <!-- Has Spa -->
                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox"
                                           th:field="*{hasSpa}"
                                           class="form-check-input"
                                           id="hasSpa">
                                    <label for="hasSpa"
                                           class="form-check-label fw-semibold"
                                           th:text="#{hotels.table.spa}">
                                        Has Spa
                                    </label>
                                </div>
                            </div>

                            <!-- Image URL -->
                            <div class="col-12">
                                <label class="form-label fw-semibold"
                                       th:text="#{hotels.table.image}">
                                    Image URL
                                </label>
                                <input type="text"
                                       th:field="*{imageUrl}"
                                       class="form-control"
                                       th:placeholder="#{hotels.placeholder.image}">
                                <div class="text-danger small mt-1"
                                     th:errors="*{imageUrl}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-info-circle me-1"></i>
                                    <span th:text="#{hotel.description}">Hotel Description</span>
                                </label>

                                <textarea id="description"
                                          class="form-control"
                                          rows="6"
                                          maxlength="4000"
                                          th:placeholder="#{hotel.description.placeholder}"
                                          th:field="*{description}">
                            </textarea>

                                <div class="d-flex justify-content-between mt-1">
                                    <small class="text-muted" th:text="#{hotel.description.max}">
                                        Max 4000 characters
                                    </small>
                                    <small id="charCounter" class="char-counter">
                                        0 / 4000
                                    </small>
                                </div>

                                <div class="text-danger small mt-1" th:errors="*{description}"></div>
                            </div>


                        </div>

                        <!-- Buttons -->
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-circle"></i>
                                <span th:text="#{button.save}">Save</span>
                            </button>

                            <a th:href="@{/hotels}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i>
                                <span th:text="#{hotel.back}">Back</span>
                            </a>
                        </div>

                    </form>

                </div>

            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/bundle-add-hotel.js}"></script>

</body>
</html>
