<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{nav.addHotel}">Add Hotel</title>

    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<!-- MAIN -->
<main class="flex-grow-1">
    <div class="container my-4">

        <!-- Page title -->
        <h2 class="text-primary mb-4">
            <i class="bi bi-building-add"></i>
            <span th:text="#{nav.addHotel}">Add Hotel</span>
        </h2>

        <!-- Wide centered form -->
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <form th:action="@{/hotels/add}"
                      th:object="${hotelForm}"
                      method="post"
                      class="card p-4 shadow-sm needs-validation"
                      novalidate>

                    <div class="row g-3">

                        <!-- Hotel name -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{hotels.table.name}">
                                Name
                            </label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{name}"></div>
                        </div>

                        <!-- Opened on -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{hotels.table.opened}">
                                Opened On
                            </label>
                            <input type="date"
                                   th:field="*{openedOn}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{openedOn}"></div>
                        </div>

                        <!-- Stars -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{hotels.table.stars}">
                                Stars
                            </label>
                            <input type="number"
                                   min="1"
                                   max="5"
                                   th:field="*{stars}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{stars}"></div>
                        </div>

                        <!-- Has Spa -->
                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox"
                                       th:field="*{hasSpa}"
                                       class="form-check-input"
                                       id="hasSpa">
                                <label for="hasSpa"
                                       class="form-check-label fw-semibold"
                                       th:text="#{hotels.table.spa}">
                                    Has Spa
                                </label>
                            </div>
                        </div>

                        <!-- Image URL -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{hotels.table.image}">
                                Image URL
                            </label>
                            <input type="text"
                                   th:field="*{imageUrl}"
                                   class="form-control"
                                   placeholder="/images/hotels/example.jpg">
                            <div class="text-danger small mt-1"
                                 th:errors="*{imageUrl}"></div>
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle"></i>
                            <span th:text="#{button.save}">Save</span>
                        </button>

                        <a th:href="@{/hotels}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i>
                            <span th:text="#{hotel.back}">Back</span>
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
