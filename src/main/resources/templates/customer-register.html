<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/styles :: commonHead}"></th:block><title>Create account</title></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: body}"></div>
<!-- Public customer account form -->
<main class="container my-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm border-0"><div class="card-body p-4">
    <h1 class="h3 text-primary mb-2">Create your account</h1>
    <p class="text-muted">Create a profile to book available rooms and manage your stays.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <!-- Controller sends the raw form values to CustomerService -->
    <form method="post" th:action="@{/register}">
        <div class="mb-3"><label class="form-label" for="fullName">Full name</label><input id="fullName" name="fullName" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="dob">Date of birth</label><input id="dob" name="dob" type="date" class="form-control" required></div>
        <div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" name="password" type="password" minlength="8" class="form-control" required></div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
</div></div></div></div></main>
<div th:replace="~{fragments/footer :: body}"></div></body></html>
