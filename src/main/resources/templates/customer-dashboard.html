<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/styles :: commonHead}"></th:block><title>My bookings</title></head>
<body class="bg-light"><div th:replace="~{fragments/navbar :: body}"></div>
<main class="container my-4">
    <!-- Customer profile and booking overview -->
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4"><div><h1 class="h2 text-primary mb-1">My bookings</h1><p class="text-muted mb-0" th:text="${profile.fullName} + ' · ' + ${profile.email}"></p></div><a class="btn btn-primary" th:href="@{/rooms}">Find a room</a></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <!-- Only this customer bookings are passed from CustomerService -->
    <div class="card shadow-sm border-0"><div class="card-body p-0 table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Room</th><th>Hotel</th><th>Check-in</th><th>Check-out</th><th class="text-end">Total</th><th class="text-end">Action</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" class="text-center text-muted py-4">You do not have any bookings yet.</td></tr>
        <tr th:each="booking : ${bookings}">
            <td th:text="${'Room ' + booking.room.number}"></td><td th:text="${booking.room.hotel.name}"></td>
            <td th:text="${#temporals.format(booking.checkInDate, 'dd MMM yyyy')}"></td><td th:text="${#temporals.format(booking.checkOutDate, 'dd MMM yyyy')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(booking.finalPrice, 1, 2)} + ' €'"></td>
            <td class="text-end"><form method="post" th:action="@{/my/bookings/{id}/cancel(id=${booking.id})}"><button class="btn btn-sm btn-outline-danger">Cancel</button></form></td>
        </tr></tbody>
    </table></div></div>
</main><div th:replace="~{fragments/footer :: body}"></div></body></html>
