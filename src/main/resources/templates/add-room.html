<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.addRoom}">Add Room</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- include the navigation bar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<h2 th:text="#{nav.addRoom}">Add Room</h2>

<!-- Form for adding new room -->
<form th:action="@{/rooms/add}" th:object="${room}" method="post">

    <!-- Room number -->
    <div>
        <label for="number" th:text="#{rooms.table.number}">Number:</label>
        <input id="number" type="number" th:field="*{number}" required>
    </div>

    <!-- Room type (dropdown) -->
    <div>
        <label for="type" th:text="#{rooms.table.type}">Type:</label>
        <select id="type" th:field="*{type}">
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
        </select>
    </div>

    <!-- Price per night -->
    <div>
        <label for="price" th:text="#{rooms.table.price}">Price / night (€):</label>
        <input id="price" type="number" step="0.01" th:field="*{pricePerNight}" required>
    </div>

    <!-- Sea view checkbox -->
    <div>
        <label for="seaView" th:text="#{rooms.table.seaView}">Sea View:</label>
        <input id="seaView" type="checkbox" th:field="*{seaView}">
    </div>

    <!-- Room photo URL -->
    <div>
        <label for="photo" th:text="#{rooms.table.photo}">Photo URL:</label>
        <input id="photo" type="text" th:field="*{photoUrl}">
    </div>

    <!-- Save button -->
    <div>
        <button type="submit" th:text="#{button.save}">Save</button>
    </div>

</form>

</body>
</html>
