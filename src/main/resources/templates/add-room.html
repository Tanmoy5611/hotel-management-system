<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{nav.addRoom}">Add Room</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<!-- Main -->
<main sec:authorize="hasRole('ADMIN')" class="flex-grow-1">
    <div class="container my-4">

        <!-- Anonymous users -->
        <div sec:authorize="!hasRole('ADMIN')" class="container mt-5 text-center">

            <div class="alert alert-danger shadow-sm">

                <i class="bi bi-shield-lock me-2"></i>
                You are not authorized to access this page.

            </div>

            <a href="/" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i>
                Go to Home
            </a>

        </div>

        <!-- Page title -->
        <h2 class="text-primary mb-4">
            <i class="bi bi-door-open-fill"></i>
            <span th:text="#{nav.addRoom}">Add Room</span>
        </h2>

        <div id="formError"
             class="alert alert-danger alert-dismissible fade show d-none"
             role="alert">

            <span id="formErrorMessage"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"></button>
        </div>

        <!-- Wide centered form -->
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <form id="add-room-form"
                      th:object="${roomForm}"
                      class="card p-4 shadow-sm needs-validation"
                      novalidate>

                    <div class="row g-3">

                        <!-- Room number -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{rooms.table.number}">
                                Number
                            </label>
                            <input type="number"
                                   th:field="*{number}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{number}"></div>
                        </div>

                        <!-- Room type -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{rooms.table.type}">
                                Type
                            </label>
                            <select th:field="*{type}" class="form-select">
                                <option value="" th:text="#{rooms.selectType}"></option>
                                <option th:each="t : ${types}"
                                        th:value="${t}"
                                        th:text="${t}">
                                </option>
                            </select>
                            <div class="text-danger small mt-1"
                                 th:errors="*{type}"></div>
                        </div>

                        <!-- Price -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{rooms.table.price}">
                                Price / night
                            </label>
                            <input type="number"
                                   step="0.01"
                                   th:field="*{pricePerNight}"
                                   class="form-control">
                            <div class="text-danger small mt-1"
                                 th:errors="*{pricePerNight}"></div>
                        </div>

                        <!-- Sea view -->
                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox"
                                       th:field="*{seaView}"
                                       class="form-check-input"
                                       id="seaView">
                                <label for="seaView"
                                       class="form-check-label fw-semibold"
                                       th:text="#{rooms.table.seaView}">
                                    Sea View
                                </label>
                            </div>
                        </div>

                        <!-- Photo URL -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{rooms.table.photo}">
                                Photo URL
                            </label>
                            <input type="text"
                                   th:field="*{photoUrl}"
                                   class="form-control"
                                   placeholder="/images/rooms/example.jpg">
                            <div class="text-danger small mt-1"
                                 th:errors="*{photoUrl}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-info-circle me-1"></i>
                                Room Description
                            </label>

                            <textarea id="description"
                                      name="description"
                                      class="form-control"
                                      rows="6"
                                      maxlength="1000"
                                      placeholder="Describe the room, comfort, size, atmosphere, or special features..."
                                      th:field="*{description}">
                            </textarea>

                            <div class="d-flex justify-content-between mt-1">
                                <small class="text-muted">
                                    Max 1000 characters
                                </small>
                                <small id="charCounter" class="char-counter">
                                    0 / 1000
                                </small>
                            </div>
                        </div>

                        <!-- Hotel -->
                        <div class="col-12">
                            <label class="form-label fw-semibold"
                                   th:text="#{room.hotel}">
                                Hotel
                            </label>
                            <select th:field="*{hotelId}" class="form-select" required>
                                <option value="" th:text="#{rooms.selectHotel}"></option>
                                <option th:each="h : ${hotels}"
                                        th:value="${h.hotelId}"
                                        th:text="${h.name}">
                                </option>
                            </select>
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle"></i>
                            <span th:text="#{button.save}">Save</span>
                        </button>

                        <a th:href="@{/rooms}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i>
                            <span th:text="#{room.back}">Back</span>
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: body}"></div>

<script th:src="@{/js/description-word-counter.js}"></script>

<script th:src="@{/js/add-room-api.js}"></script>

</body>
</html>
