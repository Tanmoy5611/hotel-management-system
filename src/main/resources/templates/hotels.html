<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{hotels.title}">Hotels</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="bg-light">

<!-- include the navigation bar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-4">
    <h2 class="text-primary mb-3" th:text="#{hotels.title}">All Hotels</h2>

    <!-- filter form (min stars and opened date) -->
    <form th:action="@{/hotels}" method="get" class="row g-3 mb-4">

        <div class="col-md-3">
            <label for="minStars" class="form-label fw-semibold" th:text="#{hotels.filter.minStars}">
                Min stars (mandatory when filtering):
            </label>
            <input id="minStars" type="number" name="minStars" min="1" max="5" th:value="${param.minStars}"
                   class="form-control" required>
        </div>

        <div class="col-md-3">
            <label for="openedAfter" class="form-label fw-semibold" th:text="#{hotels.filter.openedAfter}">
                Opened after (yyyy-mm-dd, optional):
            </label>
            <input id="openedAfter" type="text" name="openedAfter" placeholder="1990-01-01"
                   th:value="${param.openedAfter}" class="form-control">
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100" th:text="#{button.filter}">
                Filter
            </button>
        </div>

        <!-- element only visible on large screens -->
        <div class="col-md-4 d-none d-lg-block text-end text-muted fst-italic">
            <i class="bi bi-info-circle"></i>
            <span th:text="#{hotels.tip}">Tip: Resize window to see responsive cards!</span>
        </div>
    </form>

    <!-- Responsive Card Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

        <div class="col" th:each="h : ${hotels}">
            <div class="card h-100 shadow-sm hover-card">
                <a th:href="@{'/hotels/' + ${h.id}}" class="text-decoration-none text-dark">

                    <!-- Hotel Image -->
                    <img th:src="@{${h.imageUrl}}" class="card-img-top hotel-img" alt="Hotel photo">

                    <!-- Card Body -->
                    <div class="card-body">
                        <h5 class="card-title text-center fw-bold mb-3" th:text="${h.name}">
                            Hotel Name
                        </h5>

                        <p class="card-text mb-2">
                            <i class="bi bi-star-fill text-warning"></i>
                            <span th:text="${h.stars} + ' ★'"></span>
                        </p>

                        <p class="card-text mb-2">
                            <i class="bi bi-calendar-event text-secondary"></i>
                            <span th:text="${h.openedOn}"></span>
                        </p>

                        <p class="card-text">
                            <i class="bi bi-spa text-success"></i>
                            <span th:text="${h.hasSpa} ? #{hotels.spaYes} : #{hotels.spaNo}"></span>
                        </p>
                    </div>
                </a>

                <!-- Footer -->
                <div class="card-footer small d-flex justify-content-between align-items-center">
                    <span class="text-muted" th:text="#{hotels.footer.text}">Explore more...</span>

                    <button type="button"
                            class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal"
                            th:data-bs-target="${'#deleteModal-' + h.id}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>

            </div>


            <!-- Delete Modal -->
            <div class="modal fade" th:id="${'deleteModal-' + h.id}" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white py-2">
                            <h6 class="modal-title" th:text="#{modal.delete.title}"></h6>
                            <button type="button" class="btn-close btn-close-white"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body text-center">
                            <p class="mb-2" th:text="#{modal.delete.hotelQuestion}"></p>
                            <strong th:text="${h.name}"></strong>
                        </div>

                        <div class="modal-footer justify-content-between">
                            <button type="button"
                                    class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="modal"
                                    th:text="#{button.cancel}">
                            </button>

                            <form th:action="@{'/hotels/' + ${h.id} + '/delete'}" method="post">
                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        th:text="#{button.delete}">
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Count hotels below -->
    <p class="mt-4 text-muted">
        <i class="bi bi-collection"></i>
        <span th:text="${#lists.size(hotels)} + ' ' + #{hotels.total}">Total hotels: 5</span>
    </p>
</div>

<!-- Footer-->
<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
