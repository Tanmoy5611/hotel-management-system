<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{activity.management}">Activity Management</title>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: body}"></div>

<main class="container my-4" sec:authorize="hasRole('ADMIN')">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-semibold text-primary mb-1">
                <i class="bi bi-activity"></i>
                <span th:text="#{activity.management}">Activity Management</span>
            </h2>
            <p class="text-muted mb-0" th:text="#{activity.subtitle}">Browse user and system activities.</p>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
            <span class="badge rounded-pill text-bg-secondary px-3 py-2"
                  th:text="${activityPage.totalElements} + ' ' + #{activity.items}">
                0 items
            </span>

            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{admin.dashboard.title}">Dashboard</span>
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{activity.action}">Action</th>
                    <th th:text="#{activity.description}">Description</th>
                    <th th:text="#{activity.user}">User</th>
                    <th th:text="#{activity.time}">Time</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        <i class="bi bi-inbox me-2"></i>
                        <span th:text="#{activity.empty}">No recent activity</span>
                    </td>
                </tr>

                <tr th:each="log : ${logs}">
                    <td>
                        <span class="badge d-inline-flex align-items-center gap-1 px-3 py-2"
                              th:classappend="
                                ${log.action.name().contains('DELETE')} ? 'bg-danger' :
                                (${log.action.name().contains('CREATE')} ? 'bg-success' :
                                (${log.action.name().contains('BOOK')} ? 'bg-primary' : 'bg-secondary'))">
                            <i class="bi"
                               th:classappend="
                                ${log.action.name().contains('DELETE')} ? 'bi-trash' :
                                (${log.action.name().contains('CREATE')} ? 'bi-plus-circle' :
                                (${log.action.name().contains('BOOK')} ? 'bi-calendar-check' : 'bi-info-circle'))">
                            </i>

                            <span th:text="${log.action.name().replace('_', ' ')}">
                                ACTION
                            </span>
                        </span>
                    </td>

                    <td th:text="${log.description}">
                        Description
                    </td>

                    <td>
                        <i class="bi bi-person-circle me-1 text-muted"></i>
                        <span th:text="${log.user.email}"></span>
                    </td>

                    <td>
                        <small class="text-muted"
                               th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy HH:mm')}">
                            26 Mar 19:30
                        </small>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${activityPage.totalPages > 1}"
         class="modern-pagination d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4"
         th:aria-label="#{activity.pagination.label}">
        <span class="text-muted small"
              th:text="#{activity.pagination.page(${activityPage.number + 1}, ${activityPage.totalPages})}">
            Page 1 of 1
        </span>

        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${!activityPage.hasPrevious()} ? 'disabled'">
                <a th:if="${activityPage.hasPrevious()}" class="page-link"
                   th:href="@{/admin/activity(page=${activityPage.number - 1})}"
                   th:aria-label="#{activity.pagination.previous}">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i><span class="visually-hidden" th:text="#{activity.pagination.previous}">Previous</span>
                </a>
                <span th:unless="${activityPage.hasPrevious()}" class="page-link" aria-disabled="true">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i><span class="visually-hidden" th:text="#{activity.pagination.previous}">Previous</span>
                </span>
            </li>

            <li th:if="${pageNumbers.get(0) > 0}" class="page-item">
                <a class="page-link" th:href="@{/admin/activity(page=0)}">1</a>
            </li>
            <li th:if="${pageNumbers.get(0) > 1}" class="page-item disabled" aria-hidden="true">
                <span class="page-link">…</span>
            </li>

            <li th:each="pageNumber : ${pageNumbers}" class="page-item"
                th:classappend="${pageNumber == activityPage.number} ? 'active'">
                <span th:if="${pageNumber == activityPage.number}" class="page-link" aria-current="page"
                      th:text="${pageNumber + 1}">1</span>
                <a th:unless="${pageNumber == activityPage.number}" class="page-link"
                   th:href="@{/admin/activity(page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>

            <li th:if="${pageNumbers.get(pageNumbers.size() - 1) < activityPage.totalPages - 2}"
                class="page-item disabled" aria-hidden="true">
                <span class="page-link">…</span>
            </li>
            <li th:if="${pageNumbers.get(pageNumbers.size() - 1) < activityPage.totalPages - 1}" class="page-item">
                <a class="page-link" th:href="@{/admin/activity(page=${activityPage.totalPages - 1})}"
                   th:text="${activityPage.totalPages}">99</a>
            </li>

            <li class="page-item" th:classappend="${!activityPage.hasNext()} ? 'disabled'">
                <a th:if="${activityPage.hasNext()}" class="page-link"
                   th:href="@{/admin/activity(page=${activityPage.number + 1})}"
                   th:aria-label="#{activity.pagination.next}">
                    <i class="bi bi-chevron-right" aria-hidden="true"></i><span class="visually-hidden" th:text="#{activity.pagination.next}">Next</span>
                </a>
                <span th:unless="${activityPage.hasNext()}" class="page-link" aria-disabled="true">
                    <i class="bi bi-chevron-right" aria-hidden="true"></i><span class="visually-hidden" th:text="#{activity.pagination.next}">Next</span>
                </span>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: body}"></div>

</body>
</html>
