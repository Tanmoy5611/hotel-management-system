<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title>Edit Hotel Description</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />


</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-5">

    <!-- Not allowed message -->
    <div sec:authorize="!hasRole('ADMIN')" class="alert alert-danger">
        You are not allowed to edit hotel descriptions.
    </div>

    <!-- Admin only -->
    <div sec:authorize="hasRole('ADMIN')">

        <!-- Card -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    Edit Hotel Description
                </h5>
            </div>

            <div class="card-body">

                <form th:action="@{/hotels/{hotelId}/edit-description(hotelId=${hotel.hotelId})}"
                      method="post"
                      th:object="${hotel}">

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-info-circle me-1"></i>
                            Hotel Description
                        </label>

                        <textarea id="description-input"
                                  class="form-control"
                                  rows="8"
                                  maxlength="4000"
                                  placeholder="Write about the hotel's history, atmosphere, and special features..."
                                  th:field="*{description}">
                    </textarea>

                        <!-- Counter -->
                        <div class="d-flex justify-content-between mt-1">
                            <small class="text-muted">
                                Max 4000 characters
                            </small>
                            <small id="charCounter" class="char-counter">
                                0 / 4000
                            </small>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>
                            Save
                        </button>

                        <a th:href="@{/hotels/{hotelId}(hotelId=${hotel.hotelId})}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

<!-- Footer-->
<div th:replace="~{fragments/footer :: body}"></div>

<script th:src="@{/js/csrf.js}"></script>

<script th:src="@{/js/description-word-counter.js}"></script>

</body>
</html>
