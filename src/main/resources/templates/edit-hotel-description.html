<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/bundle-edit-description.css}">
    <title th:text="#{hotel.description.edit}">Edit Hotel Description</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />


</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-5">

    <!-- Not allowed message -->
    <div sec:authorize="!hasRole('ADMIN')" class="alert alert-danger">
        <span th:text="#{auth.notAllowed.hotelDescription}">You are not allowed to edit hotel descriptions.</span>
    </div>

    <!-- Admin only -->
    <div sec:authorize="hasRole('ADMIN')">

        <!-- Card -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    <span th:text="#{hotel.description.edit}">Edit Hotel Description</span>
                </h5>
            </div>

            <div class="card-body">

                <form th:action="@{/hotels/{hotelId}/edit-description(hotelId=${hotel.hotelId})}"
                      method="post"
                      th:object="${hotel}">

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-info-circle me-1"></i>
                            <span th:text="#{hotel.description}">Hotel Description</span>
                        </label>

                        <textarea id="description-input"
                                  class="form-control"
                                  rows="8"
                                  maxlength="4000"
                                  th:placeholder="#{hotel.description.edit.placeholder}"
                                  th:field="*{description}">
                    </textarea>

                        <!-- Counter -->
                        <div class="d-flex justify-content-between mt-1">
                            <small class="text-muted">
                                <span th:text="#{hotel.description.max}">Max 4000 characters</span>
                            </small>
                            <small id="charCounter" class="char-counter">
                                0 / 4000
                            </small>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="#{button.save}">Save</span>
                        </button>

                        <a th:href="@{/hotels/{hotelId}(hotelId=${hotel.hotelId})}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>
                            <span th:text="#{button.cancel}">Cancel</span>
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

<!-- Footer-->
<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/bundle-edit-description.js}"></script>

</body>
</html>
