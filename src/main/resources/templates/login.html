<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/styles :: commonHead}"></th:block>
    <title th:text="#{login.title}">Login</title>
</head>

<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container my-4">
    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-4">

            <!-- Login card -->
            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span th:text="#{login.title}">Login</span>
                    </h3>

                    <!-- Login form -->
                    <form th:action="@{/login}" method="post">

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{users.email}">Email</label>
                            <input type="email"
                                   name="username"
                                   autocomplete="username"
                                   class="form-control"
                                   th:placeholder="#{login.email.placeholder}"
                                   required>
                        </div>

                        <!-- Password with toggle -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold" th:text="#{users.password}">Password</label>

                            <div class="input-group">

                                <input type="password"
                                       id="passwordField"
                                       name="password"
                                       autocomplete="current-password"
                                       class="form-control"
                                       th:placeholder="#{login.password.placeholder}"
                                       required>

                                <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword()">
                                    <i id="eyeIcon" class="bi bi-eye"></i>
                                </button>

                            </div>

                        </div>

                        <!-- Login button -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="#{login.title}">Login</span>
                            </button>
                        </div>

                    </form>

                    <div class="alert alert-info text-center mt-3" th:utext="#{login.adminHint}">
                        To create new users and access all management features, please log in as <strong>Admin</strong>!
                    </div>

                    <!-- Login error -->
                    <div th:if="${param.error}" class="alert alert-danger mt-3 text-center" th:text="#{login.invalid}">
                        Invalid email or password
                    </div>

                    <!-- Logout message -->
                    <div th:if="${param.logout}" class="alert alert-success mt-3 text-center" th:text="#{login.loggedOut}">
                        You have been logged out successfully
                    </div>

                </div>
            </div>

            <!-- Test credentials -->
            <div class="card mt-3 border-0 shadow-sm">
                <div class="card-body">

                    <h6 class="mb-3">
                        <i class="bi bi-person-check"></i>
                        <span th:text="#{login.testUsers}">Test Users</span>
                    </h6>

                    <small class="text-muted">

                        <strong th:text="#{login.admin}">Admin</strong><br>
                        admin@hotelapp.com / admin123

                        <hr>

                        <strong th:text="#{login.user}">User</strong><br>
                        applicationUser@hotelapp.com / user123

                    </small>

                </div>
            </div>

        </div>

    </div>
</div>

<!-- Footer-->
<div th:replace="~{fragments/footer :: body}"></div>

<script defer th:src="@{/js/bundle-auth.js}"></script>

</body>
</html>
