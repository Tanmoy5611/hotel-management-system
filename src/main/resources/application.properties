# Application identity
spring.application.name=programming5-hotels

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5050/hotels
spring.datasource.username=spring
spring.datasource.password=spring

# JPA / Hibernate configuration
# update database schema on startup
spring.jpa.hibernate.ddl-auto=update
# Disable Open Session In View
spring.jpa.open-in-view=false

# Advanced Query Logging (Required for monitoring)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log SQL statements to console
spring.jpa.show-sql=true
# Nice-print SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Database initialization
#  data.sql on startup
spring.sql.init.mode=never
# Ensure schema is created before data.sql runs
spring.jpa.defer-datasource-initialization=true

# i18n
# Base name for message bundles (messages_x.properties)
spring.messages.basename=messages
# Force UTF-8 encoding (REQUIRED for Bangla, French, etc.)
spring.messages.encoding=UTF-8
# Do NOT fall back to OS language
spring.messages.fallback-to-system-locale=false

spring.mvc.throw-exception-if-no-handler-found=true

# Python FastAPI AI microservice used by chat and recommendations
# Spring auto-starts this service so running MainApplication is enough in development
hotel.ai.service.base-url=http://localhost:8001
hotel.ai.service.auto-start=true
hotel.ai.service.working-directory=hotel-ai-service
# Prefer the project virtualenv so Python package versions stay reproducible
hotel.ai.service.python-executable=hotel-ai-service/.venv/bin/python3
# Maximum time Spring waits for FastAPI to answer /health during startup
hotel.ai.service.startup-timeout-seconds=20