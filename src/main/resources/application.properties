# Application identity
spring.application.name=programming5-hotels

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5050/hotels
spring.datasource.username=spring
spring.datasource.password=spring

# JPA / Hibernate configuration
# Recreate database schema on startup
spring.jpa.hibernate.ddl-auto=create
# Disable Open Session In View
spring.jpa.open-in-view=false

# Advanced Query Logging (Required for monitoring)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log SQL statements to console
spring.jpa.show-sql=true
# Nice-print SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Database initialization
# Always run data.sql on startup
spring.sql.init.mode=always
# Ensure schema is created before data.sql runs
spring.jpa.defer-datasource-initialization=true

# i18n
# Base name for message bundles (messages_x.properties)
spring.messages.basename=messages
# Force UTF-8 encoding (REQUIRED for Bangla, French, etc.)
spring.messages.encoding=UTF-8
# Do NOT fall back to OS language
spring.messages.fallback-to-system-locale=false